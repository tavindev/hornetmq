[package]
name = "hornetmq"
version = "0.1.0"
edition = "2021"
description = "A fast, Redis-backed job queue for Rust — fully compatible with BullMQ"
license = "MIT"
repository = "https://github.com/tavindev/hornetmq"
authors = ["tavindev"]
keywords = ["queue", "redis", "bullmq", "jobs", "async"]
categories = ["asynchronous"]

[dependencies]
anyhow = "1.0.79"
redis = { version = "0.24.0", features = ["streams", "tokio", "tokio-comp", "connection-manager"] }
hornetmq-macros = { version = "0.1.0", path = "../hornet-macros" }
tokio = { version = "1.33", features = ["full"] }
serde = { version = "1.0.196", features = ["derive"] }
serde_json = "1.0.113"
rmp = "0.8.12"
quote = "1.0.35"
regex = "1.10.3"
lazy_static = "1.4.0"
glob = "0.3.1"
rmp-serde = "1.1.2"
uuid = { version = "1.7.0", features = ["v4", "fast-rng", "macro-diagnostics"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "core_benchmarks"
harness = false

[[bench]]
name = "queue_benchmarks"
harness = false

[[bench]]
name = "worker_benchmarks"
harness = false
