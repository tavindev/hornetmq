[package]
name = "hornetmq-macros"
version = "0.4.0"
edition = "2021"
description = "Procedural macros for hornetmq"
license = "MIT"
repository = "https://github.com/tavindev/hornetmq"
authors = ["tavindev"]
keywords = ["queue", "redis", "bullmq", "jobs", "macros"]
categories = ["asynchronous"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = {version = "2.0.48", features = ["full"] }
